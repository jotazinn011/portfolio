<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área do usuário | SEU NOME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <a class="logo" href="index.html">
      <span class="logo-marca">SN</span>
      <span>SEU NOME</span>
    </a>
    <nav class="menu">
      <a href="index.html#inicio">Início</a>
      <a href="index.html#sobre">Sobre mim</a>
      <a href="index.html#habilidades">Habilidades</a>
      <a href="portfolio.html">Portfólio</a>
      <a href="contato.html">Contato</a>
      <a href="usuario.html" aria-label="Área do usuário">🔒</a>
    </nav>
  </header>

  <main>
    <!-- LOGIN -->
    <section id="area-login" class="secao" hidden>
      <div class="login-card">
        <svg class="cadeado" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="11" width="16" height="10" rx="2"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
        <h1>Área restrita</h1>
        <form id="form-login" class="formulario">
          <label>E-mail
            <input type="email" name="email" required autocomplete="username">
          </label>
          <label>Senha
            <input type="password" name="senha" required autocomplete="current-password">
          </label>
          <button class="botao" type="submit">Entrar</button>
          <p id="msg-login"></p>
        </form>
      </div>
    </section>

    <!-- PAINEL (aparece só depois do login) -->
    <section id="area-painel" class="secao" hidden>
      <h1>Painel</h1>
      <p>Logado como <strong id="usuario-email"></strong></p>
      <button id="botao-sair" class="botao botao-claro" type="button">Sair</button>

      <p id="aviso-permissao" hidden>Sua conta não tem permissão de administrador.</p>

      <div id="area-admin" hidden>
        <h2>Novo projeto no portfólio</h2>
        <form id="form-novo-projeto" class="formulario">
          <label>Título
            <input type="text" name="titulo" required>
          </label>
          <label>Descrição
            <textarea name="descricao" rows="3"></textarea>
          </label>
          <label>Tecnologias (separe por vírgula)
            <input type="text" name="tecnologias">
          </label>
          <label>Link (começa com https://)
            <input type="url" name="link">
          </label>
          <button class="botao" type="submit">Salvar projeto</button>
          <p id="msg-projeto"></p>
        </form>

        <h2>Leads recebidos</h2>
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr><th>Data</th><th>Nome</th><th>E-mail</th><th>Mensagem</th></tr>
            </thead>
            <tbody id="corpo-leads"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 SEU NOME</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
